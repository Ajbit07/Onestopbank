# ===========================
# Test configuration
# Loaded by BaseTest via @TestPropertySource. Defaults point at the local
# docker-compose Postgres; CI overrides them with env vars
# (see .github/workflows/ci-cd.yml).
# ===========================

# ---------------------------
# Database
# ---------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankingportal_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.main.allow-circular-references=true

# ---------------------------
# Mail
# Messages are captured by GreenMail (see TestConfig and
# GreenMailJavaMailSender); these values only satisfy Spring Boot's
# JavaMailSender auto-configuration.
# ---------------------------
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ---------------------------
# JWT (test-only secret, never used outside tests)
# ---------------------------
jwt.secret=test-only-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789
jwt.expiration=86400000
jwt.header=Authorization
jwt.prefix=Bearer

# ---------------------------
# Geolocation API (no key in tests)
# ---------------------------
geo.api.url=https://api.findip.net/
geo.api.key=
