# ===========================
# Test configuration
# Loaded by BaseTest via @TestPropertySource. Defaults point at the local
# docker-compose Postgres; CI overrides them with env vars
# (see .github/workflows/ci-cd.yml).
# ===========================

# ---------------------------
# Database
# ---------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankingportal_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.main.allow-circular-references=true

# ---------------------------
# Mail
# Messages are captured by GreenMail (see TestConfig and
# GreenMailJavaMailSender); these values only satisfy Spring Boot's
# JavaMailSender auto-configuration.
# ---------------------------
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ---------------------------
# JWT
# TokenServiceImpl.key() runs Decoders.BASE64.decode(secret) and signs with
# HS512, so this must be valid base64 that decodes to at least 64 bytes.
# Decodes to: banking-portal-test-only-signing-key-do-not-use-outside-tests-0123456789
# ---------------------------
jwt.secret=YmFua2luZy1wb3J0YWwtdGVzdC1vbmx5LXNpZ25pbmcta2V5LWRvLW5vdC11c2Utb3V0c2lkZS10ZXN0cy0wMTIzNDU2Nzg5
jwt.expiration=86400000
jwt.header=Authorization
jwt.prefix=Bearer

# ---------------------------
# Geolocation API (no key in tests)
# ---------------------------
geo.api.url=https://api.findip.net/
geo.api.key=
